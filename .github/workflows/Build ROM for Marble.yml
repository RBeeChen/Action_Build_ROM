name: Build ROM for Amber
on:
  workflow_dispatch:
    inputs:
      URL:
        description: "移植包下載地址 (例如你想移植的其他機型 LineageOS/crDroid ZIP 連結)"
        required: true
      VENDOR_URL:
        description: "底包下載地址"
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.10.0.UKWMIXM/agate-ota_full-OS1.0.10.0.UKWMIXM-user-14.0-7170db79f6.zip'
      DECRYPTION:
        description: '去除強制加密'
        required: true
        type: boolean
        default: true
      PERFECTICON:
        description: '啟用完美圖標 (若非 MIUI/HyperOS 可選 false)'
        required: true
        type: boolean
        default: false
      GithubRelease:
        description: "Github Release"
        required: true
        type: boolean
        default: true
      OneDrive:
        description: "OneDrive"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化構建環境
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      - name: 檢出倉庫文件
        uses: actions/checkout@main
        with:
          repository: Kyuofox/Action_Build_ROM
          # 拿掉原本的 ref: main，改用預設分支，或者如果你確定它是 master，可以改成 master
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 準備所需環境
        run: |
          sudo timedatectl set-timezone Asia/Taipei
          sudo apt-get install python3 aria2 p7zip-full zstd
          sudo pip install google protobuf
      - name: 構建 ROM
        run: |
          sudo bash "$GITHUB_WORKSPACE"/make.sh ${{ github.event.inputs.URL }} ${{ github.event.inputs.VENDOR_URL }} ${{ github.event.inputs.DECRYPTION }} ${{ github.event.inputs.PERFECTICON }} $GITHUB_ENV $GITHUB_WORKSPACE
      - name: 處理 ROM
        run: |
          mkdir -p "$GITHUB_WORKSPACE"/GithubRelease
          cd "$GITHUB_WORKSPACE"/GithubRelease
          sudo split -b 1536M -d "$GITHUB_WORKSPACE"/zip/${{ env.rom_name }} ${{ env.rom_name }}
          cd "$GITHUB_WORKSPACE"
          touch file.log
          echo -e "移植機型: ${{ env.model }}\n\n底包版本: ${{ env.vendor_os_version }}\n底包安全補丁版本: ${{ env.vendor_security_patch }}\n底包基線版本: ${{ env.origin_base_line}}\n底包vendor基線版本: ${{ env.vendor_base_line}}\n\n移植包版本: ${{ env.port_os_version }}\n移植包安全補丁版本: ${{ env.port_security_patch }}\n移植包基線版本: ${{ env.port_base_line }}" > file.log
      - if: ${{ github.event.inputs.GithubRelease == 'true' }}
        name: 上傳到 Github Release
        uses: ncipollo/release-action@main
        with:
          artifacts: ${{ github.workspace }}/GithubRelease/*
          name: ${{ env.port_os_version }}
          tag: ${{ env.port_os_version }}
          bodyFile: "${{ github.workspace }}/file.log"
          allowUpdates: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
