name: Build ROM for Amber (Direct Vendor Link)
on:
  workflow_dispatch:
    inputs:
      PORT_URL:
        description: "第三方 ROM 移植包下載直鏈 (例如 LineageOS/crDroid 的 ZIP 連結)"
        required: true
      MY_VENDOR_URL:
        description: "你放在 GitHub Release 的 vendor_finish.zip 下載直鏈"
        required: true
      DECRYPTION:
        description: '是否去除強制加密'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化構建環境空間
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 檢出倉庫文件
        uses: actions/checkout@main
        with:
          repository: Kyuofox/Action_Build_ROM
          # 【修復】強制指定抓取 main 分支，確保根目錄有 make.sh
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 準備所需環境
        run: |
          sudo timedatectl set-timezone Asia/Taipei
          sudo apt-get update
          sudo apt-get install -y python3 aria2 p7zip-full zstd
          sudo pip install google protobuf

      - name: 執行 ROM 移植構建 (直接注入你的 Vendor)
        run: |
          # 建立工具箱需要的目錄結構
          mkdir -p "$GITHUB_WORKSPACE"/workspace/vendor
          
          # 【修復】參數加上雙引號，防止網址內的 & 符號斷開指令
          echo "正在下載你上傳的獨立 Vendor 壓縮包..."
          aria2c -x16 -s16 -d "$GITHUB_WORKSPACE"/workspace/vendor -O vendor_finish.zip "${{ github.event.inputs.MY_VENDOR_URL }}"
          
          # 解壓你的 vendor_finish.zip 到指定目錄
          cd "$GITHUB_WORKSPACE"/workspace/vendor
          unzip vendor_finish.zip
          rm -f vendor_finish.zip
          cd "$GITHUB_WORKSPACE"
          
          # 【修復】呼叫 make.sh 時，所有動態參數全部加上雙引號
          sudo bash "$GITHUB_WORKSPACE"/make.sh "${{ github.event.inputs.PORT_URL }}" "${{ github.event.inputs.MY_VENDOR_URL }}" "${{ github.event.inputs.DECRYPTION }}" "false" "$GITHUB_ENV" "$GITHUB_WORKSPACE"

      - name: 處理與切割 ROM
        run: |
          mkdir -p "$GITHUB_WORKSPACE"/GithubRelease
          cd "$GITHUB_WORKSPACE"/GithubRelease
          sudo split -b 1536M -d "$GITHUB_WORKSPACE"/zip/${{ env.rom_name }} ${{ env.rom_name }}
          cd "$GITHUB_WORKSPACE"
          touch file.log
          echo -e "Xiaomi 11T 快速移植報告\n\n使用客製化 Vendor 驅動\n移植包版本: ${{ env.port_os_version }}" > file.log

      - name: 上傳到 Github Release
        uses: ncipollo/release-action@main
        with:
          artifacts: ${{ github.workspace }}/GithubRelease/*
          name: "Xiaomi-11T-Amber-FastBuild-${{ env.port_os_version }}"
          tag: "${{ env.port_os_version }}-${{ github.run_number }}"
          bodyFile: "${{ github.workspace }}/file.log"
          allowUpdates: true
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
